
# 模型路径
models:
  # aerial: 'models/aerial.pt'     # 无人机检测模型（第二层策略用，当前未启用）
  armor: 'best.pt'              # 激光检测模块训练权重
  data_yaml: 'data2_laser.yaml' # 对应的数据集配置文件（nc=1, names: laser）
  
# 串口配置
serial:
  port: 'COM8'
  baudrate: 115200
  enable_velocity_feedforward: false  # 禁用速度前馈：大目标运动慢，前馈只会引入超调

# GPU配置
gpu:
  enable: false                 # 是否使用GPU加速

# 相机采集参数
camera:
  exposure_time: 55915.0        # 曝光时间（微秒）35000 = 35ms
  gain: 10                      # 增益（dB），范围 0-24
  use_thread: true              # 独立线程采集（减少read阻塞，提高FPS稳定性）
  
# 相机标定参数
calibration:
  fx: 15989.09                  # 水平焦距（像素）
  fy: 15985.61                  # 垂直焦距（像素）
  cx: null                      # 主点x（null=图像中心）
  cy: null                      # 主点y（null=图像中心）
  dist_coeffs: null             # 畸变系数 [k1,k2,p1,p2,k3]（null=无畸变）
  enable_undistort: true        # 是否启用畸变校正
  
  # 从文件加载标定参数
  use_file: false               # 是否从文件加载
  file_path: 'camera_params.npz'

# 检测器参数
detector:
  strategy: 'armor_first'     
  vehicle:
    img_size: [640, 640]        # 输入图像尺寸
    conf_thres: 0.10            # 置信度阈值
    iou_thres: 0.50             # NMS IOU阈值
    max_det: 14                 # 最大检测数
  armor:
    img_size: [384, 384]        # 输入图像尺寸（平衡精度与速度）
    conf_thres: 0.10            # 置信度阈值
    iou_thres: 0.40             # NMS IOU阈值
    max_det: 1                  # 最大检测数（优先最高置信度）

# ROI策略
roi:
  expand_ratio: 0.15            # ROI扩展比例（向外扩展15%）
  min_size: 20                  # 最小ROI尺寸
  search_size: 200              # 目标丢失后的搜索区域大小

# 滤波器配置
filter:
  type: 'predictive_kalman'
  predictive_kalman:
    enabled: true
    prediction_time_ms: 0.0     # 不预测，只做平滑滤波（预测+P控制会互相放大导致震荡）
    process_noise: 5e-2
    measurement_noise: 1e-1
    max_rate_pitch: 120.0
    max_rate_roll: 120.0

# 死区控制配置
deadzone:
  enabled: true
  pitch: 0.40                   # pitch轴死区稍大，抑制上下到位晃动
  roll: 0.30
  settle_frames: 3
  visual_radius: 45

# 帧间隔控制配置
frame_interval:
  enabled: false                # 每帧都检测，减少累积延迟
  interval: 1

# 云台控制
gimbal:
  mode: 'absolute'
  control:
    gain_pitch: 0.28            # pitch降低一点，抑制上下晃动
    gain_roll: 0.35
    max_step_deg_pitch: 4.0     # pitch步长收紧一点
    max_step_deg_roll: 5.0

# 目标跟踪
tracking:
  max_lost_frames: 10           # 最大丢失帧数
  max_distance: 200             # 目标关联最大距离（像素）
  
# 可视化
visualization:
  show_vehicle_box: true        # 显示车辆框
  show_armor_box: true          # 显示装甲板框
  show_trajectory: false         # 显示轨迹
  trajectory_length: 50         # 轨迹最大长度
  show_target_id: false          # 显示目标ID
  show_stats: true              # 显示统计信息
  show_detect_method: false      # 显示检测方式（direct/vehicle_roi/search_roi）

