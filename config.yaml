global:
  state: 'B'  # 队伍颜色 R/B
  camera_mode: 'test'  # 'test':测试模式,'hik':海康相机,'video':USB相机（videocapture）
  use_serial: False  # 串口启用开关  保证了无串口时能正常调试，虽然没什么影响（有try）
  save_img: False  # 是否保存图像
  map_size: [2800, 1500]  # 战场地图尺寸

  test:
    video_path: ''  # 测试视频（如果没有留空即可，可自动回退到静态图片测试）
    loop: False  # 是否循环播放
    start_frame: 0  # 起始帧号
    playback_speed: 3.0  # 播放速度（1.0=正常速度）

serial: # 串口
  port: 'COM13'
  baudrate: 115200
  timeout: 1

filter:
  type: "sliding_window"  # 可选值：kalman/sliding_window
  sliding_window:
    window_size: 5  # 滑动窗口大小
    max_inactive_time: 2.0 # 滤波器最大不活跃时间(秒)
    threshold: 100000.0
  kalman:
    max_inactive_time: 2.0

paths:
  # test_img: 'images/test1.jpg' # 测试图片
  test_img: 'images/frame_1.jpg' # 测试图片
  calibration:
    red: 'arrays_test_red.npy' # 加载标定好的仿射变换矩阵
    blue: 'arrays_test_blue.npy'
  map_images:
    red: 'images-2026/red.jpg'  # 加载红方视角地图
    blue: 'images-2026/map_blue.jpg'
    mask: 'images-2026/map_mask.jpg' # 加载落点判断掩码
    backup: 'images-2026/image_2026.jpg'
  models:
    car: 'models/car.pt'
    armor: 'models/armor.pt'

camera_params:
  exposure_time: 16000.0 # 曝光时间
  gain: 17.9 # 增益值

kalman:
  process_noise: 1e-5
  measurement_noise: 1e-1

blind_zone:
  base_time: 3.0  # 基础预测时间
  offset_time: 1.7  # 时间偏移量(根据上一帧的信道占用数动态调整单点预测时间)
  points:
    R1: [[1091, 1087], [1014, 375]]  # (两个吊射点) [2645, 700](对面家，防英雄偷家)
    R2: [[890, 748], [235, 105]]  # (银矿，兑矿区) [1336, 813](金矿)
    R7: [[670, 758], [401, 815]]
    B1: [[1706, 402], [1792, 1131]] # [85, 750]
    B2: [[1906, 748], [2559, 1398]] # [1460, 688]
    B7: [[2126, 755], [2400, 671]]

double_vulnerability:
  trigger_mode: 'both'  # 触发策略: 'distance'(仅距离), 'motion'(仅运动趋势), 'both'(两种都启用)
  distance:
    threshold: 2.5  # 距离阈值(米)
  motion:
    close_distance: 3.0  # 近距离阈值(米)，小于此距离直接触发
    far_distance: 6.0  # 远距离阈值(米)，大于此距离不触发
    approach_speed: 0.5  # 接近速度阈值(m/s)，双方相对接近速度
    active_speed: 0.5  # 主动移动速度阈值(m/s)，己方向敌方移动的速度
    min_speed: 0.3  # 最小移动速度(m/s)，低于此速度认为无明显运动

ui:
  info_panel_size: [420, 500]  # 信息面板尺寸
  map_display_size: [900, 480]  # 地图显示尺寸
  img_display_size: [1300, 900] # 画面显示尺寸